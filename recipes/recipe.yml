---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: callcenter-os
description: This is my personal OS image.
base-image: ghcr.io/alatiera/unblue
image-version: 42
modules:
  - type: os-release
    properties:
      ID: callcenter-os
      NAME: CallCenter
      PRETTY_NAME: CallCenter OS
  - type: files
    files:
      - source: system
        destination: /
  - type: dnf
    install:
      packages:
      - clamav
      - clamav-update
      - clamd
  - type: default-flatpaks
    configurations:
    - notify: true
      scope: system
      install:
        - org.mozilla.firefox
        - com.rustdesk.RustDesk
        - com.collaboraoffice.Office
        - com.github.jeromerobert.pdfarranger
        - com.github.huluti.Curtail
        - io.gitlab.adhami3310.Converter
        - com.vixalien.sticky
        - com.rtosta.zapzap
  - type: script
    snippets:
      - curl
        https://download.linphone.org/releases/linux/app/Linphone-6.0.1-CallEdition-x86_64.AppImage
        > /usr/libexec/linphone.AppImage
      - chmod +x /usr/libexec/linphone.AppImage
  - type: script
    snippets:
      - chmod +x /etc/clamav/detected.sh
  - type: gschema-overrides
    include:
      - zz1-suspendido.gschema.override
  - type: signing
